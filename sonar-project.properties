sonar.projectKey=neurolab-ai
sonar.projectName=NeuroLab AI
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.qualitygate.wait=true
sonar.sources=neurolab,scripts,app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py,tests/**/*.mjs,tests/**/*.ts,tests/**/*.tsx
sonar.exclusions=**/__pycache__/**,data/**,eval/**,docs/**,evidence/**,**/*.csv
sonar.python.coverage.reportPaths=coverage/python.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/ui/lcov.info
